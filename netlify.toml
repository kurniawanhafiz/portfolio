[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------- Redirects ----------
# Netlify serves /achievements -> achievements.html on its own (Pretty URLs),
# these explicit rewrites just make it deterministic.
[[redirects]]
  from = "/achievements"
  to = "/achievements.html"
  status = 200

[[redirects]]
  from = "/projects"
  to = "/projects.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# Old shortlink kept from the previous site
[[redirects]]
  from = "/syntax"
  to = "https://drive.google.com/drive/folders/147SF6CtkBDg8sWu2iTM_VuAHfxaF9glQ"
  status = 302

# ---------- Headers ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Vite output is content-hashed -> cache forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
