<text x="64" y="168" font-size="22" font-weight="700" fill="#1d4ed8">int-zone · 192.168.1.0/24</text>
<text x="864" y="168" font-size="22" font-weight="700" fill="#15803d">dmz-zone · 172.16.1.0/24</text>
<text x="64" y="678" font-size="22" font-weight="700" fill="#c2410c">internet · 100.100.100.0/24</text>
<text x="864" y="678" font-size="22" font-weight="700" fill="#7e22ce">VPN tunnel · UDP 1194</text>
<g fill="#fff" stroke-width="2">
<rect x="70" y="200" width="340" height="150" rx="14" stroke="#3b82f6"/>
<rect x="70" y="380" width="340" height="170" rx="14" stroke="#3b82f6"/>
