<rect x="70" y="710" width="340" height="100" rx="14" stroke="#f97316"/>
<rect x="870" y="710" width="340" height="100" rx="14" stroke="#a855f7"/>
</g>
<g fill="#0f172a" font-size="20" font-weight="700">
<text x="90" y="236">int-srv</text><text x="90" y="416">Ansible (on int-srv)</text>
<text x="890" y="236">mail-srv</text><text x="890" y="366">web-01 (MASTER)</text><text x="890" y="496">web-02 (BACKUP)</text>
<text x="490" y="372">fw</text><text x="90" y="746">ani-clt (client)</text><text x="890" y="746">OpenVPN tunnel</text>
</g>
<g fill="#475569" font-size="16">
<text x="90" y="268">BIND9 DNS, slapd LDAP, OpenSSL CA</text>
<text x="90" y="296">Forward/reverse zones, per-OU users</text>
<text x="90" y="324">Root CA LKSN2025-CA, signed certs</text>
<text x="90" y="448">Ansible on int-srv drives web-02</text>
<text x="90" y="476">Idempotent playbook: Nginx vhost :8081</text>
<text x="90" y="504">Inventory + ping test</text>
<text x="890" y="264">Postfix + Dovecot (IMAP, TLS)</text>
<text x="890" y="290">LDAP auth, Roundcube webmail</text>
<text x="890" y="394">HAProxy + Keepalived, TLS termination</text>
<text x="890" y="420">Nginx :8080, VIP 172.16.1.100</text>
<text x="890" y="524">HAProxy + Keepalived (priority 100)</text>
<text x="890" y="548">Nginx :8080, redirect HTTP to HTTPS</text>
<text x="490" y="408">nftables, default deny</text>
<text x="490" y="436">NAT masquerade, port forwards</text>
<text x="490" y="464">80/443 to VIP, 53 to int-srv</text>
<text x="490" y="492">OpenVPN (UDP 1194, LDAP auth)</text>
<text x="90" y="774">Remote workstation on the WAN side</text><text x="90" y="798">OpenVPN client as a systemd service</text>
<text x="890" y="774">LDAP-authenticated, TLS certificate</text>
<text x="890" y="798">Reaches int, DMZ, web, mail and DNS</text>
</g>
