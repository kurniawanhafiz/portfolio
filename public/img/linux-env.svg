<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 870" font-family="'Segoe UI',Arial,sans-serif">
<rect width="1280" height="870" fill="#fff"/>
<text x="40" y="56" font-size="30" font-weight="700" fill="#0f172a">Linux environment: Debian 12 firewall, DMZ, internal services, VPN</text>
<text x="40" y="88" font-size="18" fill="#475569">Simplified from the LKSN 2025 Module A task description (no credentials or configs)</text>
<g stroke-width="3">
<rect x="40" y="130" width="400" height="450" rx="20" fill="#eff6ff" stroke="#3b82f6"/>
<rect x="840" y="130" width="400" height="450" rx="20" fill="#f0fdf4" stroke="#22c55e"/>
